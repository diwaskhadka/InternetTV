name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # "Run workflow" button in the Actions tab

# One run per branch/PR: a newer push cancels the older run automatically,
# and pushing a PR branch no longer runs CI twice (push + pull_request).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release --workspace
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: C ABI end-to-end test
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Windows) LIB=target/release/iptvcore_ffi.dll ;;
            macOS)   LIB=target/release/libiptvcore_ffi.dylib ;;
            *)       LIB=target/release/libiptvcore_ffi.so ;;
          esac
          python bindings/python/e2e_test.py "$LIB"
      - name: Benchmark (informational)
        run: cargo run --release -p iptvcore-cli -- bench 50000 30
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: iptvcore-windows-x64
          path: |
            target/release/iptvcore_ffi.dll
            target/release/iptvcore_ffi.dll.lib
            target/release/iptv.exe
            include/iptvcore.h

  windows-arm64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - run: cargo build --release -p iptvcore-ffi --target aarch64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: iptvcore-windows-arm64
          path: target/aarch64-pc-windows-msvc/release/iptvcore_ffi.dll

  windows-app:
    name: windows app (InternetTV.exe)
    runs-on: windows-latest
    permissions:
      contents: write # upload UI screenshots to the "ci-screenshots" draft release
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: cargo build --release -p iptvcore-ffi
      - name: Publish (self-contained, no .NET install needed)
        shell: pwsh
        # Errors are re-emitted as annotations so they are visible via the API, not only in raw logs.
        run: |
          dotnet publish windows/InternetTV.Windows/InternetTV.Windows.csproj -c Release -r win-x64 --self-contained true -o publish/InternetTV 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path build.log -Pattern ': error |error NU|error MSB|error CS' | Select-Object -First 40 | ForEach-Object { Write-Host "::error::$($_.Line.Trim())" }
            exit 1
          }
      - name: Smoke test - starts without errors
        shell: pwsh
        run: |
          $top = Get-ChildItem publish/InternetTV | ForEach-Object { if ($_.PSIsContainer) { "$($_.Name)/" } else { $_.Name } }
          Write-Host "::notice::Publish folder: $($top -join ', ')"
          Write-Host "::notice::libvlc/win-x64 present: $(Test-Path publish/InternetTV/libvlc/win-x64/libvlc.dll)"
          $log = Join-Path $env:LOCALAPPDATA "InternetTV\error.log"
          Remove-Item $log -ErrorAction SilentlyContinue
          $p = Start-Process publish/InternetTV/InternetTV.exe -PassThru
          Start-Sleep -Seconds 20
          $alive = -not $p.HasExited
          if ($alive) { Stop-Process -Id $p.Id -Force }
          if (Test-Path $log) { Get-Content $log | Select-Object -First 30 | ForEach-Object { Write-Host "::error::$_" }; exit 1 }
          if (-not $alive) { Write-Host "::error::InternetTV exited during startup (code $($p.ExitCode))"; exit 1 }
          Write-Host "InternetTV.exe started and stayed up for 20 s"
      - name: UI screenshots (demo data, rendered off-screen)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $data = Join-Path $env:LOCALAPPDATA "InternetTV"
          python windows/ci/make_demo_snapshot.py target/release/iptvcore_ffi.dll $data
          New-Item -ItemType Directory -Force shots | Out-Null
          $cases = [ordered]@{
            "01-dashboard"      = @("--mode", "Dashboard")
            "02-live"           = @("--mode", "Live")
            "03-movies"         = @("--mode", "Movies")
            "04-movie-details"  = @("--mode", "Movies", "--open-first")
            "05-series-details" = @("--mode", "Series", "--open-first")
            "06-favorites"      = @("--mode", "Favorites")
            "07-recent"         = @("--mode", "Recent")
            "08-added"          = @("--mode", "Added")
            "09-search"         = @("--mode", "Search", "--search", "the")
            "10-live-search"    = @("--mode", "Live", "--search", "news")
            "11-settings-src"   = @("--mode", "Live", "--settings", "Sources")
            "12-settings-dash"  = @("--mode", "Live", "--settings", "Dashboard")
            "13-light-dash"     = @("--mode", "Dashboard", "--light")
            "14-light-details"  = @("--mode", "Series", "--open-first", "--light")
            "15-movie-playing"  = @("--mode", "Movies", "--open-first", "--play-first")
            "16-episode-playing" = @("--mode", "Series", "--open-first", "--play-first")
          }
          foreach ($name in $cases.Keys) {
            $out = Join-Path (Resolve-Path shots) "$name.png"
            $settingsFile = Join-Path $data "settings.json"
            if ($cases[$name] -contains "--light") { '{ "Theme": "Light" }' | Set-Content $settingsFile } else { Remove-Item $settingsFile -ErrorAction SilentlyContinue }
            $p = Start-Process publish/InternetTV/InternetTV.exe -ArgumentList ($cases[$name] + @("--screenshot", "`"$out`"")) -PassThru
            if (-not $p.WaitForExit(45000)) { Stop-Process -Id $p.Id -Force; Write-Host "::warning::$name timed out" }
            if (Test-Path $out) { Write-Host "::notice::screenshot $name ok" } else { Write-Host "::warning::screenshot $name missing" }
          }
          $err = Join-Path $data "error.log"
          if (Test-Path $err) { Get-Content $err | Select-Object -First 20 | ForEach-Object { Write-Host "::warning::$_" } }
          gh release view ci-screenshots 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) { gh release create ci-screenshots --draft --title "CI screenshots (not a release)" --notes "UI screenshots rendered by CI with demo data." }
          gh release upload ci-screenshots (Get-ChildItem shots/*.png).FullName --clobber
      - name: Check layout and zip
        shell: pwsh
        run: |
          Copy-Item windows/README-FIRST.txt publish/InternetTV/
          if (-not (Test-Path publish/InternetTV/InternetTV.exe)) { Write-Host "::error::InternetTV.exe missing from publish output"; exit 1 }
          $top = Get-ChildItem publish/InternetTV | Select-Object -ExpandProperty Name
          Write-Host "::notice::Top-level files: $($top -join ', ')"
          if ($top.Count -gt 12) { Write-Host "::error::Too many top-level files ($($top.Count)); single-file publish did not apply"; exit 1 }
          $mb = [math]::Round(((Get-ChildItem publish/InternetTV -Recurse -File | Measure-Object Length -Sum).Sum / 1MB), 1)
          Write-Host "::notice::Unpacked size: $mb MB"
          Compress-Archive -Path publish/InternetTV -DestinationPath InternetTV-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: InternetTV-windows-x64
          path: InternetTV-windows-x64.zip

  android:
    name: android (jniLibs + APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
      - run: cargo install cargo-ndk --locked
      - name: Build jniLibs into the app
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        # API 21 = Android 5.0, the oldest Android TV release still in the wild.
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -P 21 -o android/app/src/main/jniLibs build --release -p iptvcore-ffi
      - uses: actions/upload-artifact@v4
        with:
          name: iptvcore-android-jniLibs
          path: android/app/src/main/jniLibs
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APKs
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: InternetTV-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
